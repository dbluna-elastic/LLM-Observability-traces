<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot · OpenLLMetry + Elastic</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #18181c;
      --border: #2a2a30;
      --text: #e4e4e7;
      --text-muted: #a1a1aa;
      --accent: #7c3aed;
      --accent-hover: #8b5cf6;
      --user-msg: #3b82f6;
      --assistant-msg: #27272a;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124, 58, 237, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(59, 130, 246, 0.08), transparent);
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #newChatBtn {
      padding: 0.45rem 0.85rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    #newChatBtn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(124, 58, 237, 0.12);
    }

    #newChatBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-bottom: 1rem;
    }

    .msg {
      max-width: 85%;
      padding: 0.875rem 1rem;
      border-radius: var(--radius);
      line-height: 1.5;
      box-shadow: var(--shadow);
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-msg);
      color: #fff;
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant-msg);
      border: 1px solid var(--border);
    }

    .msg .role {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .msg.user .role { color: rgba(255,255,255,0.8); }

    .msg .content {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg .tokens {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .form-wrap {
      position: sticky;
      bottom: 0;
      padding: 1rem 0;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }

    form {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      min-height: 48px;
      max-height: 160px;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      resize: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #input::placeholder {
      color: var(--text-muted);
    }

    #input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }

    button[type="submit"] {
      height: 48px;
      padding: 0 1.25rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.2s;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      color: #f87171;
      font-size: 0.9rem;
      padding: 0.5rem 0;
    }

    .typing {
      opacity: 0.7;
    }

    .run-tests-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    #runTestsBtn {
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    #runTestsBtn:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--accent);
    }

    #runTestsBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #runTestsProgress {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .name-wrap {
      margin-bottom: 0.5rem;
    }

    .name-wrap label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    #nameInput {
      width: 100%;
      padding: 0.5rem 0.75rem;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    #nameInput::placeholder {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">AI</div>
    <h1>Chatbot</h1>
    <div class="header-actions">
      <button type="button" id="newChatBtn" title="Clear messages and start a fresh conversation">New chat</button>
      <span class="badge">OpenLLMetry → Elastic</span>
    </div>
  </header>

  <main>
    <div id="messages"></div>
    <div class="form-wrap">
      <div class="run-tests-wrap">
        <button type="button" id="runTestsBtn">Run test questions</button>
        <span id="runTestsProgress"></span>
      </div>
      <form id="form">
        <div class="name-wrap">
          <label for="nameInput">Name</label>
          <input type="text" id="nameInput" placeholder="Your name (optional)" />
        </div>
        <textarea
          id="input"
          placeholder="Type a message..."
          rows="1"
          required
        ></textarea>
        <button type="submit" id="submit">Send</button>
      </form>
      <div id="error" class="error" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const submitBtn = document.getElementById('submit');
    const errorEl = document.getElementById('error');
    const newChatBtn = document.getElementById('newChatBtn');
    const runTestsProgress = document.getElementById('runTestsProgress');

    const API_BASE = '';

    /** One ID per conversation for server tracing (see X-Session-ID in FastAPI). */
    let chatSessionId = crypto.randomUUID();

    function newChatHeaders() {
      return {
        'Content-Type': 'application/json',
        'X-Session-ID': chatSessionId,
      };
    }

    function startNewChat() {
      chatSessionId = crypto.randomUUID();
      messagesEl.innerHTML = '';
      setError('');
      runTestsProgress.textContent = '';
      input.value = '';
      input.style.height = 'auto';
      input.focus();
    }

    const TEST_QUESTIONS = [
      { id: 1, name: 'No-Letter Constraint (Instruction Following)', question: "Write a 50-word summary of the plot of The Matrix without using the letter 'e'." },
      { id: 2, name: 'Multi-Step Counterfactual (Reasoning)', question: "If Steve Jobs had decided to become a professional pastry chef in 1976 instead of starting Apple, how might the current landscape of smartphone interface design be different today? Provide three specific examples." },
      { id: 3, name: 'Logical Fallacy Trap (Critical Thinking)', question: "Argue in favor of the statement: 'Since every part of this machine is light, the entire machine must be light.' Then, identify the logical fallacy you just used." },
      { id: 4, name: 'Moral Dilemma with a Twist (Ethics & Nuance)', question: "A self-driving car's brakes fail. It must choose between hitting a group of five elderly pedestrians or swerving into a wall, which will certainly kill the single passenger who is a renowned cancer researcher. Do not give me a 'it's a complex issue' answer; pick a side and justify it using Utilitarianism." },
      { id: 5, name: 'Complex Code Refactoring (Technical Skill)', question: "Here is a Python function that uses nested loops to find duplicates in a list. Refactor it to O(n) time complexity, ensure it is PEP8 compliant, and add type hinting." },
      { id: 6, name: 'In-World Consistency Test (Creative Writing)', question: "Describe a sunset, but you are a Victorian-era coal miner who has never seen the sky because you've lived underground your whole life. Use metaphors only related to mining." },
      { id: 7, name: 'Zero-Shot Translation of Slang (Linguistics)', question: "Translate the phrase 'That's mid, no cap, he's just chasing clout' into 18th-century Shakespearean English." },
      { id: 8, name: 'Data Synthesis Challenge (Information Density)', question: "Compare the economic policies of the Roman Empire under Augustus to the United States' 'New Deal' in a 3-column table format, focusing on infrastructure, currency debasement, and social welfare." },
      { id: 9, name: 'Recursive Prompt (Self-Awareness)', question: "Write a prompt that would be difficult for an LLM like yourself to answer accurately, then explain why that prompt is difficult." },
      { id: 10, name: 'Theory of Mind Test (Social Intelligence)', question: "Sally puts a ball in a red basket and leaves the room. While she is gone, Anne moves the ball to a blue box. Anne then leaves. Sally returns. Where will Sally look for the ball, and why would she be surprised if she looked in the blue box?" }
    ];

    function addMessage(role, content, isTyping = false) {
      const div = document.createElement('div');
      div.className = `msg ${role}${isTyping ? ' typing' : ''}`;
      div.innerHTML = `
        <div class="role">${role}</div>
        <div class="content">${escapeHtml(content)}</div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function setError(msg) {
      errorEl.textContent = msg || '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const userMsg = addMessage('user', text);
      input.value = '';
      submitBtn.disabled = true;
      newChatBtn.disabled = true;
      setError('');

      const assistantDiv = addMessage('assistant', '…', true);
      const contentEl = assistantDiv.querySelector('.content');

      try {
        const messages = Array.from(messagesEl.querySelectorAll('.msg:not(.typing)')).map(m => ({
          role: m.classList.contains('user') ? 'user' : 'assistant',
          content: m.querySelector('.content').textContent
        }));

        const nameValue = document.getElementById('nameInput').value.trim() || undefined;
        const res = await fetch(`${API_BASE}/api/chat`, {
          method: 'POST',
          headers: newChatHeaders(),
          body: JSON.stringify({
            messages: messages.map(m => ({ role: m.role, content: m.content })),
            name: nameValue
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || res.statusText || `HTTP ${res.status}`);
        }

        const data = await res.json();
        contentEl.textContent = data.message || '(No response)';
        const total = data.total_tokens ?? (data.input_tokens != null && data.output_tokens != null ? data.input_tokens + data.output_tokens : null);
        if (total != null || data.input_tokens != null || data.output_tokens != null) {
          const parts = [];
          if (data.input_tokens != null) parts.push(`${data.input_tokens} in`);
          if (data.output_tokens != null) parts.push(`${data.output_tokens} out`);
          if (total != null && parts.length === 0) parts.push(`${total} total`);
          else if (total != null) parts.push(`${total} total`);
          const tokenEl = document.createElement('div');
          tokenEl.className = 'tokens';
          tokenEl.textContent = `Tokens: ${parts.join(' · ')}`;
          assistantDiv.appendChild(tokenEl);
        }
        assistantDiv.classList.remove('typing');
      } catch (err) {
        contentEl.textContent = 'Sorry, something went wrong.';
        assistantDiv.classList.remove('typing');
        setError(err.message || 'Request failed');
      }

      submitBtn.disabled = false;
      newChatBtn.disabled = false;
    });

    // Run test questions button
    const runTestsBtn = document.getElementById('runTestsBtn');

    newChatBtn.addEventListener('click', () => {
      if (runTestsBtn.disabled) return;
      startNewChat();
    });

    runTestsBtn.addEventListener('click', async () => {
      runTestsBtn.disabled = true;
      newChatBtn.disabled = true;
      submitBtn.disabled = true;
      setError('');
      for (let i = 0; i < TEST_QUESTIONS.length; i++) {
        const q = TEST_QUESTIONS[i];
        runTestsProgress.textContent = `Running ${i + 1}/${TEST_QUESTIONS.length}: ${q.name}`;
        addMessage('user', `[Test ${q.id}] ${q.question}`);
        const assistantDiv = addMessage('assistant', '…', true);
        const contentEl = assistantDiv.querySelector('.content');
        try {
          const nameValue = document.getElementById('nameInput').value.trim() || undefined;
          const res = await fetch(`${API_BASE}/api/chat`, {
            method: 'POST',
            headers: newChatHeaders(),
            body: JSON.stringify({ messages: [{ role: 'user', content: q.question }], name: nameValue })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || res.statusText || `HTTP ${res.status}`);
          }
          const data = await res.json();
          contentEl.textContent = data.message || '(No response)';
          const total = data.total_tokens ?? (data.input_tokens != null && data.output_tokens != null ? data.input_tokens + data.output_tokens : null);
          if (total != null || data.input_tokens != null || data.output_tokens != null) {
            const parts = [];
            if (data.input_tokens != null) parts.push(data.input_tokens + ' in');
            if (data.output_tokens != null) parts.push(data.output_tokens + ' out');
            if (total != null && parts.length === 0) parts.push(total + ' total');
            else if (total != null) parts.push(total + ' total');
            const tokenEl = document.createElement('div');
            tokenEl.className = 'tokens';
            tokenEl.textContent = 'Tokens: ' + parts.join(' · ');
            assistantDiv.appendChild(tokenEl);
          }
        } catch (err) {
          contentEl.textContent = 'Error: ' + (err.message || 'Request failed');
          setError(err.message || 'Request failed');
        }
        assistantDiv.classList.remove('typing');
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      runTestsProgress.textContent = 'Done. ' + TEST_QUESTIONS.length + ' questions run.';
      runTestsBtn.disabled = false;
      newChatBtn.disabled = false;
      submitBtn.disabled = false;
    });

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });
  </script>
</body>
</html>
