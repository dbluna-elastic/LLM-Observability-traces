<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot · OpenLLMetry + Elastic</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #18181c;
      --border: #2a2a30;
      --text: #e4e4e7;
      --text-muted: #a1a1aa;
      --accent: #7c3aed;
      --accent-hover: #8b5cf6;
      --user-msg: #3b82f6;
      --assistant-msg: #27272a;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124, 58, 237, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(59, 130, 246, 0.08), transparent);
    }

    .layout-body {
      flex: 1;
      display: flex;
      min-height: 0;
      width: 100%;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #newChatBtn {
      padding: 0.45rem 0.85rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    #newChatBtn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(124, 58, 237, 0.12);
    }

    #newChatBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .chat-column {
      flex: 1;
      min-width: 0;
      width: 100%;
      max-width: min(1680px, 100%);
      margin: 0 auto;
      padding: clamp(1.25rem, 2.5vw, 2.25rem) clamp(1rem, 3vw, 2.5rem);
      display: flex;
      flex-direction: column;
    }

    /* One row per reply: assistant message (left) + trace for that request (right) */
    .turn-with-trace {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: clamp(0.75rem, 2vw, 1.5rem);
      width: 100%;
    }

    .turn-with-trace .msg.assistant {
      flex: 1 1 50%;
      min-width: 0;
      max-width: 50%;
      align-self: flex-start;
    }

    .traceflow-inline {
      flex: 1 1 50%;
      min-width: 0;
      background: rgba(24, 24, 28, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    .traceflow-inline-header {
      padding: 0.5rem 0.85rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    /* Full trace visible — no inner scroll; page scrolls via #messages */
    .traceflow-inline-body {
      flex: none;
      overflow: visible;
      padding: 0.6rem 0.75rem 0.85rem;
    }

    .traceflow-inline-body .tf-name {
      font-size: 0.88rem;
      white-space: normal;
      overflow: visible;
      text-overflow: unset;
      line-height: 1.35;
    }

    .traceflow-inline-body .tf-kind {
      font-size: 0.65rem;
      padding: 0.18rem 0.45rem;
    }

    .traceflow-placeholder {
      font-size: 0.95rem;
      color: var(--text-muted);
      padding: 0.85rem;
      line-height: 1.55;
    }

    .tf-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      gap: 0.35rem 0.65rem;
      align-items: center;
      padding: 0.55rem 0.65rem;
      margin-bottom: 4px;
      border-radius: 10px;
      background: rgba(15, 15, 18, 0.6);
      border: 1px solid transparent;
    }

    .tf-row-main {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.25rem;
      min-width: 0;
    }

    .tf-title-line {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
      min-width: 0;
      width: 100%;
    }

    .tf-context {
      font-size: 0.8rem;
      line-height: 1.45;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 100%;
      padding-left: 0.05rem;
    }

    .tf-row.tf-depth-0 {
      border-color: rgba(59, 130, 246, 0.35);
    }

    .tf-name {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'JetBrains Mono', monospace;
    }

    .tf-kind {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.18rem 0.45rem;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .tf-kind-workflow { background: rgba(59, 130, 246, 0.25); color: #93c5fd; }
    .tf-kind-task { background: rgba(30, 64, 175, 0.35); color: #bfdbfe; }
    .tf-kind-chat { background: rgba(22, 101, 52, 0.35); color: #86efac; }
    .tf-kind-agent { background: rgba(120, 53, 15, 0.4); color: #fdba74; }
    .tf-kind-tool { background: rgba(120, 53, 15, 0.4); color: #fdba74; }
    .tf-kind-guardrail { background: rgba(107, 33, 168, 0.35); color: #e9d5ff; }

    .tf-dur {
      grid-column: 2;
      grid-row: 1;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      text-align: right;
      align-self: center;
    }

    .tf-gantt {
      grid-column: 1 / -1;
      grid-row: 2;
      height: 8px;
      background: rgba(42, 42, 48, 0.9);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }

    .tf-gantt-fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #22d3ee, #3b82f6);
      opacity: 0.95;
    }

    @media (max-width: 860px) {
      .turn-with-trace {
        flex-direction: column;
      }
      .turn-with-trace .msg.assistant {
        max-width: 100%;
        width: 100%;
      }
      .traceflow-inline {
        width: 100%;
      }
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      padding-bottom: 1rem;
    }

    .msg {
      max-width: 92%;
      padding: 1rem 1.15rem;
      border-radius: var(--radius);
      line-height: 1.55;
      box-shadow: var(--shadow);
      font-size: 1.05rem;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-msg);
      color: #fff;
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant-msg);
      border: 1px solid var(--border);
    }

    .msg .role {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .msg.user .role { color: rgba(255,255,255,0.8); }

    .msg .content {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg .tokens {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.55rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .form-wrap {
      position: sticky;
      bottom: 0;
      padding: 1rem 0;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }

    form {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      min-height: 52px;
      max-height: 180px;
      padding: 0.85rem 1.1rem;
      font-family: inherit;
      font-size: 1.05rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      resize: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #input::placeholder {
      color: var(--text-muted);
    }

    #input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }

    button[type="submit"] {
      height: 52px;
      padding: 0 1.25rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.2s;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      color: #f87171;
      font-size: 0.9rem;
      padding: 0.5rem 0;
    }

    .typing {
      opacity: 0.7;
    }

    .run-tests-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    #runTestsBtn {
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    #runTestsBtn:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--accent);
    }

    #runTestsBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #runTestsProgress {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .name-wrap {
      margin-bottom: 0.5rem;
    }

    .name-wrap label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    #nameInput {
      width: 100%;
      padding: 0.55rem 0.85rem;
      font-family: inherit;
      font-size: 1.02rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    #nameInput::placeholder {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">AI</div>
    <h1>Chatbot</h1>
    <div class="header-actions">
      <button type="button" id="newChatBtn" title="Clear messages and start a fresh conversation">New chat</button>
      <span class="badge">OpenLLMetry → Elastic</span>
    </div>
  </header>

  <div class="layout-body">
  <main class="chat-column">
    <div id="messages" aria-label="Chat messages and traces"></div>
    <div class="form-wrap">
      <div class="run-tests-wrap">
        <button type="button" id="runTestsBtn">Run test questions</button>
        <span id="runTestsProgress"></span>
      </div>
      <form id="form">
        <div class="name-wrap">
          <label for="nameInput">Name</label>
          <input type="text" id="nameInput" placeholder="Your name (optional)" />
        </div>
        <textarea
          id="input"
          placeholder="Type a message..."
          rows="1"
          required
        ></textarea>
        <button type="submit" id="submit">Send</button>
      </form>
      <div id="error" class="error" aria-live="polite"></div>
    </div>
  </main>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const submitBtn = document.getElementById('submit');
    const errorEl = document.getElementById('error');
    const newChatBtn = document.getElementById('newChatBtn');
    const runTestsProgress = document.getElementById('runTestsProgress');

    const API_BASE = '';

    /** One ID per conversation for server tracing (see X-Session-ID in FastAPI). */
    let chatSessionId = crypto.randomUUID();

    function newChatHeaders() {
      return {
        'Content-Type': 'application/json',
        'X-Session-ID': chatSessionId,
      };
    }

    function startNewChat() {
      chatSessionId = crypto.randomUUID();
      messagesEl.innerHTML = '';
      setError('');
      runTestsProgress.textContent = '';
      input.value = '';
      input.style.height = 'auto';
      input.focus();
    }

    /** Build API message list from #messages (user bubbles + completed assistant turns only). */
    function collectMessagesForApi() {
      const messages = [];
      for (const el of messagesEl.children) {
        if (el.classList.contains('msg') && el.classList.contains('user')) {
          messages.push({ role: 'user', content: el.querySelector('.content').textContent });
        } else if (el.classList.contains('turn-with-trace')) {
          const am = el.querySelector('.msg.assistant');
          if (am && !am.classList.contains('typing')) {
            messages.push({ role: 'assistant', content: am.querySelector('.content').textContent });
          }
        }
      }
      return messages;
    }

    /** Assistant message + inline trace column for this reply. */
    function addAssistantTurnWithTrace(isTyping = true) {
      const wrap = document.createElement('div');
      wrap.className = 'turn-with-trace';

      const assistantDiv = document.createElement('div');
      assistantDiv.className = `msg assistant${isTyping ? ' typing' : ''}`;
      assistantDiv.innerHTML = `<div class="role">assistant</div><div class="content">${escapeHtml(isTyping ? '…' : '')}</div>`;

      const traceCol = document.createElement('div');
      traceCol.className = 'traceflow-inline';
      traceCol.setAttribute('aria-label', 'Trace for this reply');
      const traceHead = document.createElement('div');
      traceHead.className = 'traceflow-inline-header';
      traceHead.textContent = 'Traceflow';
      const traceBody = document.createElement('div');
      traceBody.className = 'traceflow-inline-body';
      const ph = document.createElement('p');
      ph.className = 'traceflow-placeholder';
      ph.textContent = isTyping ? 'Waiting for response…' : 'No trace data.';
      traceBody.appendChild(ph);

      traceCol.appendChild(traceHead);
      traceCol.appendChild(traceBody);
      wrap.appendChild(assistantDiv);
      wrap.appendChild(traceCol);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      return {
        wrap,
        assistantDiv,
        contentEl: assistantDiv.querySelector('.content'),
        traceBodyEl: traceBody,
      };
    }

    function fmtDurationMs(ms) {
      const n = Number(ms) || 0;
      if (n >= 1000) return `${(n / 1000).toFixed(1)} s`;
      return `${n.toFixed(0)} ms`;
    }

    function kindToClass(kind) {
      const k = (kind || '').toUpperCase();
      if (k === 'WORKFLOW') return 'tf-kind-workflow';
      if (k === 'TASK') return 'tf-kind-task';
      if (k === 'CHAT') return 'tf-kind-chat';
      if (k === 'AGENT') return 'tf-kind-agent';
      if (k === 'TOOL') return 'tf-kind-tool';
      if (k === 'GUARDRAIL') return 'tf-kind-guardrail';
      return 'tf-kind-task';
    }

    function formatStepDuration(kind, ms) {
      const k = (kind || '').toUpperCase();
      if (k === 'GUARDRAIL' && (!ms || ms === 0)) return 'pre-call';
      return fmtDurationMs(ms);
    }

    /** Pre-order rows with sequential sibling timeline (matches server execution order). */
    function flattenTraceTree(node, depth, startMs, rows) {
      if (!node) return;
      rows.push({
        name: node.name || '—',
        kind: node.kind || 'TASK',
        duration_ms: node.duration_ms ?? 0,
        depth,
        startMs,
        detail: node.detail || '',
        context: node.context || '',
      });
      let cursor = startMs;
      const kids = node.children || [];
      for (const c of kids) {
        flattenTraceTree(c, depth + 1, cursor, rows);
        cursor += c.duration_ms ?? 0;
      }
    }

    function renderTraceflowInto(traceBodyEl, tree) {
      traceBodyEl.innerHTML = '';
      if (!tree || !tree.name) {
        const p = document.createElement('p');
        p.className = 'traceflow-placeholder';
        p.textContent = 'No trace data for this reply.';
        traceBodyEl.appendChild(p);
        return;
      }
      const total = Math.max(tree.duration_ms || 1, 1);
      const rows = [];
      flattenTraceTree(tree, 0, 0, rows);

      for (const r of rows) {
        const row = document.createElement('div');
        row.className = `tf-row tf-depth-${r.depth}`;
        row.style.marginLeft = `${r.depth * 10}px`;
        const tip = [r.detail, r.context].filter(Boolean).join('\n\n');
        if (tip) row.title = tip;

        const main = document.createElement('div');
        main.className = 'tf-row-main';
        const titleLine = document.createElement('div');
        titleLine.className = 'tf-title-line';
        const nameEl = document.createElement('span');
        nameEl.className = 'tf-name';
        nameEl.textContent = r.name;
        nameEl.title = tip || r.name;
        const badge = document.createElement('span');
        badge.className = `tf-kind ${kindToClass(r.kind)}`;
        badge.textContent = r.kind;
        titleLine.appendChild(nameEl);
        titleLine.appendChild(badge);
        main.appendChild(titleLine);
        if (r.context) {
          const ctxEl = document.createElement('div');
          ctxEl.className = 'tf-context';
          ctxEl.textContent = r.context;
          main.appendChild(ctxEl);
        }

        const dur = document.createElement('span');
        dur.className = 'tf-dur';
        dur.textContent = formatStepDuration(r.kind, r.duration_ms);

        const gantt = document.createElement('div');
        gantt.className = 'tf-gantt';
        const fill = document.createElement('div');
        fill.className = 'tf-gantt-fill';
        const guardrailNoTiming =
          String(r.kind).toUpperCase() === 'GUARDRAIL' && (!r.duration_ms || r.duration_ms === 0);
        if (guardrailNoTiming) {
          gantt.style.display = 'none';
        } else {
          const leftPct = (r.startMs / total) * 100;
          const wPct = Math.max((r.duration_ms / total) * 100, 0.5);
          fill.style.left = `${leftPct}%`;
          fill.style.width = `${wPct}%`;
        }
        gantt.appendChild(fill);

        row.appendChild(main);
        row.appendChild(dur);
        row.appendChild(gantt);
        traceBodyEl.appendChild(row);
      }
    }

    const TEST_QUESTIONS = [
      { id: 1, name: 'No-Letter Constraint (Instruction Following)', question: "Write a 50-word summary of the plot of The Matrix without using the letter 'e'." },
      { id: 2, name: 'Multi-Step Counterfactual (Reasoning)', question: "If Steve Jobs had decided to become a professional pastry chef in 1976 instead of starting Apple, how might the current landscape of smartphone interface design be different today? Provide three specific examples." },
      { id: 3, name: 'Logical Fallacy Trap (Critical Thinking)', question: "Argue in favor of the statement: 'Since every part of this machine is light, the entire machine must be light.' Then, identify the logical fallacy you just used." },
      { id: 4, name: 'Moral Dilemma with a Twist (Ethics & Nuance)', question: "A self-driving car's brakes fail. It must choose between hitting a group of five elderly pedestrians or swerving into a wall, which will certainly kill the single passenger who is a renowned cancer researcher. Do not give me a 'it's a complex issue' answer; pick a side and justify it using Utilitarianism." },
      { id: 5, name: 'Complex Code Refactoring (Technical Skill)', question: "Here is a Python function that uses nested loops to find duplicates in a list. Refactor it to O(n) time complexity, ensure it is PEP8 compliant, and add type hinting." },
      { id: 6, name: 'In-World Consistency Test (Creative Writing)', question: "Describe a sunset, but you are a Victorian-era coal miner who has never seen the sky because you've lived underground your whole life. Use metaphors only related to mining." },
      { id: 7, name: 'Zero-Shot Translation of Slang (Linguistics)', question: "Translate the phrase 'That's mid, no cap, he's just chasing clout' into 18th-century Shakespearean English." },
      { id: 8, name: 'Data Synthesis Challenge (Information Density)', question: "Compare the economic policies of the Roman Empire under Augustus to the United States' 'New Deal' in a 3-column table format, focusing on infrastructure, currency debasement, and social welfare." },
      { id: 9, name: 'Recursive Prompt (Self-Awareness)', question: "Write a prompt that would be difficult for an LLM like yourself to answer accurately, then explain why that prompt is difficult." },
      { id: 10, name: 'Theory of Mind Test (Social Intelligence)', question: "Sally puts a ball in a red basket and leaves the room. While she is gone, Anne moves the ball to a blue box. Anne then leaves. Sally returns. Where will Sally look for the ball, and why would she be surprised if she looked in the blue box?" }
    ];

    function addMessage(role, content, isTyping = false) {
      const div = document.createElement('div');
      div.className = `msg ${role}${isTyping ? ' typing' : ''}`;
      div.innerHTML = `
        <div class="role">${role}</div>
        <div class="content">${escapeHtml(content)}</div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function setError(msg) {
      errorEl.textContent = msg || '';
    }

    /** Show DeepEval answer_relevancy when API returns evaluation (DEEPEVAL_SCORE_CHAT=true). */
    function appendEvaluation(assistantDiv, ev) {
      if (!ev || typeof ev !== 'object') return;
      const line = document.createElement('div');
      line.className = 'tokens';
      if (ev.skipped) {
        line.textContent = 'Eval: skipped';
        assistantDiv.appendChild(line);
        return;
      }
      if (ev.error) {
        line.textContent = 'Eval error: ' + String(ev.error).slice(0, 240);
        assistantDiv.appendChild(line);
        return;
      }
      if (ev.score != null) {
        const n = typeof ev.score === 'number' ? ev.score.toFixed(3) : String(ev.score);
        let s = 'DeepEval answer relevancy: ' + n;
        if (ev.success === false) s += ' (below threshold)';
        if (ev.judge_model) s += ' · judge: ' + ev.judge_model;
        line.textContent = s;
        assistantDiv.appendChild(line);
      }
      if (ev.reason) {
        const r = document.createElement('div');
        r.className = 'tokens';
        r.style.marginTop = '0.25rem';
        r.style.fontSize = '0.78rem';
        const rs = String(ev.reason);
        r.textContent = rs.slice(0, 500) + (rs.length > 500 ? '…' : '');
        assistantDiv.appendChild(r);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage('user', text);
      input.value = '';
      submitBtn.disabled = true;
      newChatBtn.disabled = true;
      setError('');

      const turn = addAssistantTurnWithTrace(true);
      const assistantDiv = turn.assistantDiv;
      const contentEl = turn.contentEl;
      const traceBodyEl = turn.traceBodyEl;

      try {
        const messages = collectMessagesForApi();

        const nameValue = document.getElementById('nameInput').value.trim() || undefined;
        const res = await fetch(`${API_BASE}/api/chat`, {
          method: 'POST',
          headers: newChatHeaders(),
          body: JSON.stringify({
            messages: messages.map(m => ({ role: m.role, content: m.content })),
            name: nameValue
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || res.statusText || `HTTP ${res.status}`);
        }

        const data = await res.json();
        contentEl.textContent = data.message || '(No response)';
        renderTraceflowInto(traceBodyEl, data.traceflow);
        const total = data.total_tokens ?? (data.input_tokens != null && data.output_tokens != null ? data.input_tokens + data.output_tokens : null);
        if (total != null || data.input_tokens != null || data.output_tokens != null) {
          const parts = [];
          if (data.input_tokens != null) parts.push(`${data.input_tokens} in`);
          if (data.output_tokens != null) parts.push(`${data.output_tokens} out`);
          if (total != null && parts.length === 0) parts.push(`${total} total`);
          else if (total != null) parts.push(`${total} total`);
          const tokenEl = document.createElement('div');
          tokenEl.className = 'tokens';
          tokenEl.textContent = `Tokens: ${parts.join(' · ')}`;
          assistantDiv.appendChild(tokenEl);
        }
        appendEvaluation(assistantDiv, data.evaluation);
        assistantDiv.classList.remove('typing');
      } catch (err) {
        contentEl.textContent = 'Sorry, something went wrong.';
        assistantDiv.classList.remove('typing');
        traceBodyEl.innerHTML = '';
        const pe = document.createElement('p');
        pe.className = 'traceflow-placeholder';
        pe.textContent = 'Request failed — no trace.';
        traceBodyEl.appendChild(pe);
        setError(err.message || 'Request failed');
      }

      submitBtn.disabled = false;
      newChatBtn.disabled = false;
    });

    // Run test questions button
    const runTestsBtn = document.getElementById('runTestsBtn');

    newChatBtn.addEventListener('click', () => {
      if (runTestsBtn.disabled) return;
      startNewChat();
    });

    runTestsBtn.addEventListener('click', async () => {
      runTestsBtn.disabled = true;
      newChatBtn.disabled = true;
      submitBtn.disabled = true;
      setError('');
      for (let i = 0; i < TEST_QUESTIONS.length; i++) {
        const q = TEST_QUESTIONS[i];
        runTestsProgress.textContent = `Running ${i + 1}/${TEST_QUESTIONS.length}: ${q.name}`;
        addMessage('user', `[Test ${q.id}] ${q.question}`);
        const turn = addAssistantTurnWithTrace(true);
        const assistantDiv = turn.assistantDiv;
        const contentEl = turn.contentEl;
        const traceBodyEl = turn.traceBodyEl;
        try {
          const nameValue = document.getElementById('nameInput').value.trim() || undefined;
          const res = await fetch(`${API_BASE}/api/chat`, {
            method: 'POST',
            headers: newChatHeaders(),
            body: JSON.stringify({ messages: [{ role: 'user', content: q.question }], name: nameValue })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || res.statusText || `HTTP ${res.status}`);
          }
          const data = await res.json();
          contentEl.textContent = data.message || '(No response)';
          renderTraceflowInto(traceBodyEl, data.traceflow);
          const total = data.total_tokens ?? (data.input_tokens != null && data.output_tokens != null ? data.input_tokens + data.output_tokens : null);
          if (total != null || data.input_tokens != null || data.output_tokens != null) {
            const parts = [];
            if (data.input_tokens != null) parts.push(data.input_tokens + ' in');
            if (data.output_tokens != null) parts.push(data.output_tokens + ' out');
            if (total != null && parts.length === 0) parts.push(total + ' total');
            else if (total != null) parts.push(total + ' total');
            const tokenEl = document.createElement('div');
            tokenEl.className = 'tokens';
            tokenEl.textContent = 'Tokens: ' + parts.join(' · ');
            assistantDiv.appendChild(tokenEl);
          }
          appendEvaluation(assistantDiv, data.evaluation);
        } catch (err) {
          contentEl.textContent = 'Error: ' + (err.message || 'Request failed');
          traceBodyEl.innerHTML = '';
          const pe = document.createElement('p');
          pe.className = 'traceflow-placeholder';
          pe.textContent = 'Request failed — no trace.';
          traceBodyEl.appendChild(pe);
          setError(err.message || 'Request failed');
        }
        assistantDiv.classList.remove('typing');
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      runTestsProgress.textContent = 'Done. ' + TEST_QUESTIONS.length + ' questions run.';
      runTestsBtn.disabled = false;
      newChatBtn.disabled = false;
      submitBtn.disabled = false;
    });

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });
  </script>
</body>
</html>
