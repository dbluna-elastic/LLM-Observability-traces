<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat · Elasticsearch observability</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Elastic / Elasticsearch palette: dark shells (#343741, #25262e), UI ink, brand accents.
       Cluster SVG: static/elastic-cluster.svg (Elastic trademark). */

    :root {
      --elastic-dark: #343741;
      --elastic-void: #1c1d24;
      --elastic-elevated: #25262e;
      --elastic-ink: #07101f;
      --elastic-blue: #1ba9f5;
      --elastic-blue-strong: #0b64dd;
      --elastic-yellow: #fec514;
      --elastic-teal: #00bfb3;
      --elastic-pink: #f04e98;

      --bg: var(--elastic-void);
      --bg-elevated: var(--elastic-elevated);
      --bg-deep: var(--elastic-dark);
      --surface: rgba(52, 55, 65, 0.55);
      --surface-strong: rgba(52, 55, 65, 0.78);
      --border: rgba(255, 255, 255, 0.1);
      --border-soft: rgba(255, 255, 255, 0.06);
      --text: #f5f7fa;
      --text-muted: #b3b8c4;
      --accent-yellow: var(--elastic-yellow);
      --accent-orange: #f68f1e;
      --accent-pink: var(--elastic-pink);
      --accent-cyan: var(--elastic-blue);
      --accent-teal: var(--elastic-teal);
      --accent: var(--elastic-blue);
      --accent-hover: #4bc3f8;
      --cta-text: #ffffff;
      --user-msg: #eef2f6;
      --user-msg-ink: var(--elastic-ink);
      --assistant-msg: rgba(52, 55, 65, 0.92);
      --radius: 12px;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 70% at 90% 20%, rgba(11, 100, 221, 0.14) 0%, transparent 50%),
        radial-gradient(ellipse 55% 50% at 0% 100%, rgba(0, 191, 179, 0.08) 0%, transparent 45%),
        linear-gradient(180deg, var(--elastic-elevated) 0%, var(--elastic-void) 45%);
    }

    /** Soft wireframe echo (dark grey, slide-style) */
    body::after {
      content: '';
      position: fixed;
      width: clamp(240px, 38vw, 480px);
      height: clamp(240px, 38vw, 480px);
      right: -6%;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.18;
      background: none;
      border: 3px solid rgba(52, 55, 65, 0.9);
      border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%;
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.05),
        -18px -10px 0 -2px rgba(0, 0, 0, 0.25);
    }

    header,
    .layout-body {
      position: relative;
      z-index: 1;
    }

    .layout-body {
      flex: 1;
      display: flex;
      min-height: 0;
      width: 100%;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: clamp(1rem, 3vw, 1.75rem);
      background: rgba(28, 29, 36, 0.85);
      backdrop-filter: blur(12px);
    }

    .header-leading {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      flex-shrink: 0;
    }

    .elastic-mark {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: block;
    }

    .es-wordmark {
      height: 1.85rem;
      width: auto;
      max-width: min(240px, 38vw);
      flex-shrink: 1;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      min-width: 0;
    }

    h1 {
      font-size: 1.22rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
      text-align: left;
      color: var(--text);
    }

    header .tagline {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      margin: 0.2rem 0 0;
      letter-spacing: 0.02em;
      max-width: 48ch;
      line-height: 1.35;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #newChatBtn {
      padding: 0.45rem 0.85rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    #newChatBtn:hover:not(:disabled) {
      border-color: var(--elastic-blue);
      background: var(--surface-strong);
      color: #fff;
    }

    #newChatBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.68rem;
      padding: 0.28rem 0.58rem;
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .badge img.badge-logo {
      width: 0.95rem;
      height: 0.95rem;
      vertical-align: -3px;
      margin-right: 0.35rem;
    }

    .chat-column {
      flex: 1;
      min-width: 0;
      min-height: 0;
      width: 100%;
      max-width: min(1680px, 100%);
      margin: 0 auto;
      padding: clamp(1.25rem, 2.5vw, 2.25rem) clamp(1rem, 3vw, 2.5rem);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* One row per reply: assistant message (left) + trace for that request (right) */
    .turn-with-trace {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: clamp(0.75rem, 2vw, 1.5rem);
      width: 100%;
    }

    .turn-with-trace .msg.assistant {
      flex: 1 1 50%;
      min-width: 0;
      max-width: 50%;
      align-self: flex-start;
    }

    .traceflow-inline {
      flex: 1 1 50%;
      min-width: 0;
      background: rgba(37, 38, 46, 0.96);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    .traceflow-inline-header {
      padding: 0.5rem 0.85rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-soft);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    /* Full trace visible — no inner scroll; page scrolls via #messages */
    .traceflow-inline-body {
      flex: none;
      overflow: visible;
      padding: 0.6rem 0.75rem 0.85rem;
    }

    .traceflow-inline-body .tf-name {
      font-size: 0.88rem;
      white-space: normal;
      overflow: visible;
      text-overflow: unset;
      line-height: 1.35;
    }

    .traceflow-inline-body .tf-kind {
      font-size: 0.65rem;
      padding: 0.18rem 0.45rem;
    }

    .traceflow-placeholder {
      font-size: 0.95rem;
      color: var(--text-muted);
      padding: 0.85rem;
      line-height: 1.55;
    }

    .tf-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      gap: 0.35rem 0.65rem;
      align-items: center;
      padding: 0.55rem 0.65rem;
      margin-bottom: 4px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid transparent;
    }

    .tf-row-main {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.25rem;
      min-width: 0;
    }

    .tf-title-line {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
      min-width: 0;
      width: 100%;
    }

    .tf-context {
      font-size: 0.8rem;
      line-height: 1.45;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 100%;
      padding-left: 0.05rem;
    }

    .tf-row.tf-depth-0 {
      border-color: rgba(27, 169, 245, 0.45);
    }

    .tf-name {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255, 255, 255, 0.95);
    }

    .tf-kind {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.18rem 0.45rem;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .tf-kind-workflow { background: rgba(59, 130, 246, 0.25); color: #93c5fd; }
    .tf-kind-task { background: rgba(30, 64, 175, 0.35); color: #bfdbfe; }
    .tf-kind-chat { background: rgba(22, 101, 52, 0.35); color: #86efac; }
    .tf-kind-agent { background: rgba(120, 53, 15, 0.4); color: #fdba74; }
    .tf-kind-tool { background: rgba(120, 53, 15, 0.4); color: #fdba74; }
    .tf-kind-guardrail { background: rgba(107, 33, 168, 0.35); color: #e9d5ff; }

    .tf-dur {
      grid-column: 2;
      grid-row: 1;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      text-align: right;
      align-self: center;
    }

    .tf-gantt {
      grid-column: 1 / -1;
      grid-row: 2;
      height: 8px;
      background: rgba(52, 55, 65, 0.9);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }

    .tf-gantt-fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--elastic-blue), var(--elastic-teal));
      opacity: 0.98;
    }

    @media (max-width: 860px) {
      .turn-with-trace {
        flex-direction: column;
      }
      .turn-with-trace .msg.assistant {
        max-width: 100%;
        width: 100%;
      }
      .traceflow-inline {
        width: 100%;
      }
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      padding-bottom: 1rem;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 92%;
      padding: 1rem 1.15rem;
      border-radius: var(--radius);
      line-height: 1.55;
      box-shadow: var(--shadow);
      font-size: 1.05rem;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-msg);
      color: var(--user-msg-ink);
      border: 1px solid rgba(52, 55, 65, 0.22);
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant-msg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .msg .role {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .msg.user .role { color: rgba(7, 16, 31, 0.48); }

    .msg .content {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg .tokens {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.55rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* DeepEval: same row “bubble” language as traceflow (assistant column) */
    .msg .deeval-section {
      margin-top: 0.65rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--border);
    }

    .msg .deeval-section-header {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4rem;
      margin-bottom: 0.45rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .msg .deeval-row.tf-row {
      border-color: rgba(240, 78, 152, 0.35);
      background: rgba(0, 0, 0, 0.18);
    }

    .msg .deeval-row.deeval-nested {
      margin-left: 10px;
      border-color: rgba(240, 78, 152, 0.18);
    }

    .msg .deeval-row .tf-gantt-fill.deeval-gantt-fill {
      background: linear-gradient(90deg, var(--elastic-pink), var(--elastic-blue));
    }

    .tf-kind-metric { background: rgba(240, 78, 152, 0.32); color: #fce7f3; }
    .tf-kind-eval-error { background: rgba(190, 18, 60, 0.35); color: #fecdd3; }
    .tf-kind-eval-skip { background: rgba(82, 82, 91, 0.45); color: #d4d4d8; }
    .tf-kind-goal { background: rgba(14, 116, 144, 0.35); color: #a5f3fc; }
    .tf-kind-outcome { background: rgba(21, 128, 61, 0.35); color: #bbf7d0; }

    .form-wrap {
      position: sticky;
      bottom: 0;
      padding: 1rem 0;
      background: linear-gradient(to top, var(--elastic-void) 72%, rgba(28, 29, 36, 0));
    }

    form {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      min-height: 52px;
      max-height: 180px;
      padding: 0.85rem 1.1rem;
      font-family: inherit;
      font-size: 1.05rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      resize: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #input::placeholder {
      color: var(--text-muted);
    }

    #input:focus {
      outline: none;
      border-color: rgba(27, 169, 245, 0.65);
      box-shadow: 0 0 0 3px rgba(27, 169, 245, 0.12);
    }

    button[type="submit"] {
      height: 52px;
      padding: 0 1.25rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--cta-text);
      background: var(--elastic-blue);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 2px 16px rgba(11, 100, 221, 0.38);
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      color: #ff9f9a;
      font-size: 0.9rem;
      padding: 0.5rem 0;
    }

    .typing {
      opacity: 0.7;
    }

    .run-tests-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    #runTestsBtn {
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    #runTestsBtn:hover:not(:disabled) {
      color: #fff;
      border-color: var(--elastic-yellow);
      background: rgba(52, 55, 65, 0.65);
    }

    #runTestsBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #runTestsProgress {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .name-wrap {
      margin-bottom: 0.5rem;
    }

    .name-wrap label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    #nameInput {
      width: 100%;
      padding: 0.55rem 0.85rem;
      font-family: inherit;
      font-size: 1.02rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    #nameInput::placeholder {
      color: var(--text-muted);
    }

    #categorySelect {
      width: 100%;
      padding: 0.55rem 0.85rem;
      font-family: inherit;
      font-size: 1.02rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 0.5rem;
    }

    #categorySelect:focus,
    #nameInput:focus {
      outline: none;
      border-color: rgba(27, 169, 245, 0.55);
      box-shadow: 0 0 0 3px rgba(27, 169, 245, 0.1);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-leading">
      <img class="elastic-mark" src="/static/elastic-cluster.svg" width="44" height="44" alt="Elastic logo" />
      <svg class="es-wordmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 40" role="img" aria-labelledby="esWordmarkTitle">
        <title id="esWordmarkTitle">Elasticsearch</title>
        <text x="0" y="31" fill="#F5F7FA" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600">
          elasticsearch<tspan baseline-shift="super" font-size="11" fill="rgba(245,247,250,0.75)">®</tspan>
        </text>
      </svg>
    </div>
    <div class="brand-block">
      <h1>Chatbot</h1>
      <p class="tagline">OpenLLMetry traces exported to Elasticsearch observability.</p>
    </div>
    <div class="header-actions">
      <button type="button" id="newChatBtn" title="Clear messages and start a fresh conversation">New chat</button>
      <span class="badge"><img class="badge-logo" src="/static/elastic-cluster.svg" alt="" width="14" height="14" /> OpenLLMetry → Elasticsearch</span>
    </div>
  </header>

  <div class="layout-body">
  <main class="chat-column">
    <div id="messages" aria-label="Chat messages and traces"></div>
    <div class="form-wrap">
      <div class="run-tests-wrap">
        <button type="button" id="runTestsBtn">Run test questions</button>
        <span id="runTestsProgress"></span>
      </div>
      <form id="form">
        <div class="name-wrap">
          <label for="categorySelect">Use case</label>
          <select id="categorySelect" aria-label="Use case category"></select>
        </div>
        <div class="name-wrap">
          <label for="nameInput">Name</label>
          <input type="text" id="nameInput" placeholder="Your name (optional)" />
        </div>
        <textarea
          id="input"
          placeholder="Type a message..."
          rows="1"
          required
        ></textarea>
        <button type="submit" id="submit">Send</button>
      </form>
      <div id="error" class="error" aria-live="polite"></div>
    </div>
  </main>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const submitBtn = document.getElementById('submit');
    const errorEl = document.getElementById('error');
    const newChatBtn = document.getElementById('newChatBtn');
    const runTestsProgress = document.getElementById('runTestsProgress');

    const API_BASE = '';

    /** One ID per conversation for server tracing (see X-Session-ID in FastAPI). */
    let chatSessionId = crypto.randomUUID();

    /** Scroll the chat column to the latest message (after layout / trace DOM updates). */
    function scrollChatToBottom() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      });
    }

    function newChatHeaders() {
      return {
        'Content-Type': 'application/json',
        'X-Session-ID': chatSessionId,
      };
    }

    const FALLBACK_CATEGORIES = [
      'Technical', 'Content', 'Sales', 'Customer Success', 'Product',
      'Services and Consulting', 'Marketing', 'Legal', 'Operations',
      'Human Capital', 'Other',
    ];

    function fillCategorySelect() {
      const sel = document.getElementById('categorySelect');
      if (!sel) return;
      const render = (arr) => {
        const prev = sel.value;
        sel.innerHTML = '';
        arr.forEach((c) => {
          const o = document.createElement('option');
          o.value = c;
          o.textContent = c;
          sel.appendChild(o);
        });
        if (prev && arr.includes(prev)) sel.value = prev;
      };
      render(FALLBACK_CATEGORIES);
      fetch(`${API_BASE}/api/prompt/categories`)
        .then((r) => (r.ok ? r.json() : Promise.reject()))
        .then((j) => {
          const list = Array.isArray(j.categories) ? j.categories : [];
          if (list.length) render(list);
        })
        .catch(() => {});
    }

    fillCategorySelect();

    function startNewChat() {
      chatSessionId = crypto.randomUUID();
      messagesEl.innerHTML = '';
      setError('');
      runTestsProgress.textContent = '';
      input.value = '';
      input.style.height = 'auto';
      input.focus();
    }

    /** Build API message list from #messages (user bubbles + completed assistant turns only). */
    function collectMessagesForApi() {
      const messages = [];
      for (const el of messagesEl.children) {
        if (el.classList.contains('msg') && el.classList.contains('user')) {
          messages.push({ role: 'user', content: el.querySelector('.content').textContent });
        } else if (el.classList.contains('turn-with-trace')) {
          const am = el.querySelector('.msg.assistant');
          if (am && !am.classList.contains('typing')) {
            messages.push({ role: 'assistant', content: am.querySelector('.content').textContent });
          }
        }
      }
      return messages;
    }

    /** Assistant message + inline trace column for this reply. */
    function addAssistantTurnWithTrace(isTyping = true) {
      const wrap = document.createElement('div');
      wrap.className = 'turn-with-trace';

      const assistantDiv = document.createElement('div');
      assistantDiv.className = `msg assistant${isTyping ? ' typing' : ''}`;
      assistantDiv.innerHTML = `<div class="role">assistant</div><div class="content">${escapeHtml(isTyping ? '…' : '')}</div>`;

      const traceCol = document.createElement('div');
      traceCol.className = 'traceflow-inline';
      traceCol.setAttribute('aria-label', 'Trace for this reply');
      const traceHead = document.createElement('div');
      traceHead.className = 'traceflow-inline-header';
      traceHead.textContent = 'Traceflow';
      const traceBody = document.createElement('div');
      traceBody.className = 'traceflow-inline-body';
      const ph = document.createElement('p');
      ph.className = 'traceflow-placeholder';
      ph.textContent = isTyping ? 'Waiting for response…' : 'No trace data.';
      traceBody.appendChild(ph);

      traceCol.appendChild(traceHead);
      traceCol.appendChild(traceBody);
      wrap.appendChild(assistantDiv);
      wrap.appendChild(traceCol);
      messagesEl.appendChild(wrap);
      scrollChatToBottom();

      return {
        wrap,
        assistantDiv,
        contentEl: assistantDiv.querySelector('.content'),
        traceBodyEl: traceBody,
      };
    }

    function fmtDurationMs(ms) {
      const n = Number(ms) || 0;
      if (n >= 1000) return `${(n / 1000).toFixed(1)} s`;
      return `${n.toFixed(0)} ms`;
    }

    function kindToClass(kind) {
      const k = (kind || '').toUpperCase();
      if (k === 'WORKFLOW') return 'tf-kind-workflow';
      if (k === 'TASK') return 'tf-kind-task';
      if (k === 'CHAT') return 'tf-kind-chat';
      if (k === 'AGENT') return 'tf-kind-agent';
      if (k === 'TOOL') return 'tf-kind-tool';
      if (k === 'GUARDRAIL') return 'tf-kind-guardrail';
      return 'tf-kind-task';
    }

    function deevalKindBadgeClass(kind) {
      const k = (kind || '').toUpperCase();
      if (k === 'METRIC') return 'tf-kind-metric';
      if (k === 'ERROR') return 'tf-kind-eval-error';
      if (k === 'SKIP') return 'tf-kind-eval-skip';
      if (k === 'GOAL') return 'tf-kind-goal';
      if (k === 'OUTCOME') return 'tf-kind-outcome';
      return 'tf-kind-metric';
    }

    /**
     * One traceflow-style row inside the assistant message (name + kind badge + optional score bar).
     */
    function appendDeevalRow(container, opts) {
      const {
        name,
        kind = 'METRIC',
        rightText = '—',
        score01 = null,
        context = '',
        nested = false,
        titleTip = '',
      } = opts;
      const row = document.createElement('div');
      row.className = `tf-row tf-depth-0 deeval-row${nested ? ' deeval-nested' : ''}`;
      if (titleTip) row.title = titleTip;

      const main = document.createElement('div');
      main.className = 'tf-row-main';
      const titleLine = document.createElement('div');
      titleLine.className = 'tf-title-line';
      const nameEl = document.createElement('span');
      nameEl.className = 'tf-name';
      nameEl.textContent = name || '—';
      if (titleTip) nameEl.title = titleTip;
      const badge = document.createElement('span');
      badge.className = `tf-kind ${deevalKindBadgeClass(kind)}`;
      badge.textContent = kind;
      titleLine.appendChild(nameEl);
      titleLine.appendChild(badge);
      main.appendChild(titleLine);
      if (context) {
        const ctxEl = document.createElement('div');
        ctxEl.className = 'tf-context';
        ctxEl.textContent = context;
        main.appendChild(ctxEl);
      }

      const dur = document.createElement('span');
      dur.className = 'tf-dur';
      dur.textContent = rightText;

      const gantt = document.createElement('div');
      gantt.className = 'tf-gantt';
      const fill = document.createElement('div');
      fill.className = 'tf-gantt-fill deeval-gantt-fill';
      if (score01 != null && Number.isFinite(Number(score01))) {
        const pct = Math.max(0.5, Math.min(100, Number(score01) * 100));
        fill.style.left = '0%';
        fill.style.width = `${pct}%`;
      } else {
        gantt.style.display = 'none';
      }
      gantt.appendChild(fill);

      row.appendChild(main);
      row.appendChild(dur);
      row.appendChild(gantt);
      container.appendChild(row);
    }

    function formatStepDuration(kind, ms) {
      const k = (kind || '').toUpperCase();
      if (k === 'GUARDRAIL' && (!ms || ms === 0)) return 'pre-call';
      return fmtDurationMs(ms);
    }

    /** Pre-order rows with sequential sibling timeline (matches server execution order). */
    function flattenTraceTree(node, depth, startMs, rows) {
      if (!node) return;
      rows.push({
        name: node.name || '—',
        kind: node.kind || 'TASK',
        duration_ms: node.duration_ms ?? 0,
        depth,
        startMs,
        detail: node.detail || '',
        context: node.context || '',
      });
      let cursor = startMs;
      const kids = node.children || [];
      for (const c of kids) {
        flattenTraceTree(c, depth + 1, cursor, rows);
        cursor += c.duration_ms ?? 0;
      }
    }

    function renderTraceflowInto(traceBodyEl, tree) {
      traceBodyEl.innerHTML = '';
      if (!tree || !tree.name) {
        const p = document.createElement('p');
        p.className = 'traceflow-placeholder';
        p.textContent = 'No trace data for this reply.';
        traceBodyEl.appendChild(p);
        return;
      }
      const total = Math.max(tree.duration_ms || 1, 1);
      const rows = [];
      flattenTraceTree(tree, 0, 0, rows);

      for (const r of rows) {
        const row = document.createElement('div');
        row.className = `tf-row tf-depth-${r.depth}`;
        row.style.marginLeft = `${r.depth * 10}px`;
        const tip = [r.detail, r.context].filter(Boolean).join('\n\n');
        if (tip) row.title = tip;

        const main = document.createElement('div');
        main.className = 'tf-row-main';
        const titleLine = document.createElement('div');
        titleLine.className = 'tf-title-line';
        const nameEl = document.createElement('span');
        nameEl.className = 'tf-name';
        nameEl.textContent = r.name;
        nameEl.title = tip || r.name;
        const badge = document.createElement('span');
        badge.className = `tf-kind ${kindToClass(r.kind)}`;
        badge.textContent = r.kind;
        titleLine.appendChild(nameEl);
        titleLine.appendChild(badge);
        main.appendChild(titleLine);
        if (r.context) {
          const ctxEl = document.createElement('div');
          ctxEl.className = 'tf-context';
          ctxEl.textContent = r.context;
          main.appendChild(ctxEl);
        }

        const dur = document.createElement('span');
        dur.className = 'tf-dur';
        dur.textContent = formatStepDuration(r.kind, r.duration_ms);

        const gantt = document.createElement('div');
        gantt.className = 'tf-gantt';
        const fill = document.createElement('div');
        fill.className = 'tf-gantt-fill';
        const guardrailNoTiming =
          String(r.kind).toUpperCase() === 'GUARDRAIL' && (!r.duration_ms || r.duration_ms === 0);
        if (guardrailNoTiming) {
          gantt.style.display = 'none';
        } else {
          const leftPct = (r.startMs / total) * 100;
          const wPct = Math.max((r.duration_ms / total) * 100, 0.5);
          fill.style.left = `${leftPct}%`;
          fill.style.width = `${wPct}%`;
        }
        gantt.appendChild(fill);

        row.appendChild(main);
        row.appendChild(dur);
        row.appendChild(gantt);
        traceBodyEl.appendChild(row);
      }
    }

    // Batch assumes CHATBOT_USE_TOOLS=true. fetch_url (Q5, Q10, Q12) only when MCP_FETCH_ENABLED=true; Q12 uses a non-allowlisted host to stress policy.
    const TEST_CHAT_MODELS = [
      'llm-gateway/gpt-5-mini',
      'llm-gateway/gpt-4.1-nano',
      'llm-gateway/claude-sonnet-4-6',
      'llm-gateway/gemini-2.5-pro'
    ];
    const TEST_QUESTIONS = [
      { id: 1, name: 'Tool: current weather (Houston)', question: 'What is the current weather in Houston, Texas? Use your tools and report temperature in Fahrenheit.' },
      { id: 2, name: 'Tool: Texas colleges knowledge base (Rice)', question: 'Using the Texas colleges knowledge base, what notable facts can you share about Rice University in Houston?' },
      { id: 3, name: 'Tool: time (America/Chicago)', question: 'What is the current date and time in the America/Chicago timezone? Use your tool with that exact IANA timezone name.' },
      { id: 4, name: 'Tool: unit conversion (miles to km)', question: 'Convert exactly 100 miles to kilometers using your convert_units tool and report the numeric result.' },
      { id: 5, name: 'Tool: fetch URL (example.com)', question: 'Fetch https://example.com with your URL fetch tool if you have one, then give a one-sentence summary. If you cannot fetch URLs, say so clearly.' },
      { id: 6, name: 'Multi: weather Dallas + time Chicago', question: 'What is the current weather in Dallas, Texas in Fahrenheit, and what is the current local time in America/Chicago? Use a separate tool call for each.' },
      { id: 7, name: 'Multi: KB Texas A&M + weather College Station', question: 'Give one fact about Texas A&M University from your Texas colleges knowledge base, then report the current weather in College Station, Texas in Fahrenheit.' },
      { id: 8, name: 'Multi: convert F to C + UTC time', question: 'Convert 212 degrees Fahrenheit to Celsius using your tool, and tell me the current time in UTC using your time tool.' },
      { id: 9, name: 'Multi: compare two schools (KB only)', question: 'Compare The University of Texas at Austin and Texas A&M University using only facts from your Texas colleges knowledge base: city or location and one academic or campus strength for each.' },
      { id: 10, name: 'Multi: orchestration (weather, time, convert, KB, optional fetch)', question: 'In one turn, use your tools for all of: (1) current weather in San Antonio, Texas in Fahrenheit, (2) current date and time in UTC, (3) convert 50 miles to kilometers, (4) one sentence about UT Austin from the Texas colleges knowledge base. If you have a web fetch tool, also fetch https://example.com and quote one short line from the page.' },
      { id: 11, name: 'Edge: invalid IANA timezone', question: 'What is the current date and time in the America/Fakeville timezone? Use your time tool with that exact IANA timezone string.' },
      { id: 12, name: 'Edge: fetch non-allowlisted host', question: 'Fetch https://example.org/ with your URL fetch tool and summarize the page. If your policy blocks that host, say so clearly.' },
      { id: 13, name: 'Edge: nonexistent tool', question: 'Use your get_stock_quote tool to fetch the latest price of AAPL. If you do not have that tool, say so and do not invent a price.' },
      { id: 14, name: 'Edge: KB stats not in corpus', question: 'Using only the Texas colleges knowledge base, list the exact current undergraduate enrollment numbers for UT Austin, Texas A&M, and Rice University for the current academic year.' },
      { id: 15, name: 'Edge: nonsense convert_units', question: 'Use convert_units to convert the text hello exactly into kilograms and report the numeric result.' }
    ];

    function addMessage(role, content, isTyping = false) {
      const div = document.createElement('div');
      div.className = `msg ${role}${isTyping ? ' typing' : ''}`;
      div.innerHTML = `
        <div class="role">${role}</div>
        <div class="content">${escapeHtml(content)}</div>
      `;
      messagesEl.appendChild(div);
      scrollChatToBottom();
      return div;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function setError(msg) {
      errorEl.textContent = msg || '';
    }

    /** DeepEval as traceflow-like bubbles on the assistant side. */
    function appendEvaluation(assistantDiv, ev) {
      if (!ev || typeof ev !== 'object') return;

      const tc = ev.task_completion;
      const hasTc = tc && typeof tc === 'object';
      if (ev.skipped && !hasTc) {
        const wrap = document.createElement('div');
        wrap.className = 'deeval-section';
        const head = document.createElement('div');
        head.className = 'deeval-section-header';
        head.textContent = 'DeepEval';
        wrap.appendChild(head);
        appendDeevalRow(wrap, {
          name: 'answer_relevancy',
          kind: 'SKIP',
          rightText: 'skipped',
          score01: null,
          context: ev.reason ? String(ev.reason).slice(0, 600) : 'No scoring run',
        });
        assistantDiv.appendChild(wrap);
        return;
      }

      const wrap = document.createElement('div');
      wrap.className = 'deeval-section';
      const head = document.createElement('div');
      head.className = 'deeval-section-header';
      head.textContent = 'DeepEval';
      wrap.appendChild(head);

      if (ev.error && ev.score == null && !ev.skipped) {
        appendDeevalRow(wrap, {
          name: 'answer_relevancy',
          kind: 'ERROR',
          rightText: 'failed',
          score01: null,
          context: String(ev.error).slice(0, 800),
          titleTip: String(ev.error).slice(0, 2000),
        });
      }

      if (ev.score != null && ev.metric !== 'task_completion') {
        const n = typeof ev.score === 'number' ? ev.score.toFixed(3) : String(ev.score);
        const parts = [];
        if (ev.success === false) parts.push('below threshold');
        if (ev.judge_model) parts.push('judge: ' + ev.judge_model);
        let ctx = '';
        if (ev.reason) ctx = String(ev.reason).slice(0, 600) + (String(ev.reason).length > 600 ? '…' : '');
        if (parts.length) {
          ctx = (ctx ? ctx + '\n\n' : '') + parts.join(' · ');
        }
        appendDeevalRow(wrap, {
          name: 'answer_relevancy',
          kind: 'METRIC',
          rightText: n,
          score01: Number(ev.score),
          context: ctx,
        });
      }

      if (hasTc) {
        if (tc.error) {
          appendDeevalRow(wrap, {
            name: 'task_completion',
            kind: 'ERROR',
            rightText: 'failed',
            score01: null,
            context: String(tc.error).slice(0, 800),
            titleTip: String(tc.error).slice(0, 2000),
          });
        } else if (tc.score != null) {
          const n = typeof tc.score === 'number' ? tc.score.toFixed(3) : String(tc.score);
          const parts = [];
          if (tc.success === false) parts.push('below threshold');
          if (tc.judge_model) parts.push('judge: ' + tc.judge_model);
          let ctx = '';
          if (tc.reason) ctx = String(tc.reason).slice(0, 500) + (String(tc.reason).length > 500 ? '…' : '');
          if (parts.length) ctx = (ctx ? ctx + '\n\n' : '') + parts.join(' · ');
          appendDeevalRow(wrap, {
            name: 'task_completion',
            kind: 'METRIC',
            rightText: n,
            score01: Number(tc.score),
            context: ctx,
          });
        } else {
          appendDeevalRow(wrap, {
            name: 'task_completion',
            kind: 'METRIC',
            rightText: '—',
            score01: null,
            context: 'No score returned',
          });
        }

        if (tc.user_goal && !tc.error) {
          appendDeevalRow(wrap, {
            name: 'inferred_user_goal',
            kind: 'GOAL',
            rightText: '—',
            score01: null,
            context: String(tc.user_goal).slice(0, 700) + (String(tc.user_goal).length > 700 ? '…' : ''),
            nested: true,
          });
        }
        if (tc.task_outcome && !tc.error) {
          appendDeevalRow(wrap, {
            name: 'task_outcome',
            kind: 'OUTCOME',
            rightText: '—',
            score01: null,
            context: String(tc.task_outcome).slice(0, 700) + (String(tc.task_outcome).length > 700 ? '…' : ''),
            nested: true,
          });
        }
      }

      if (wrap.childNodes.length > 1) {
        assistantDiv.appendChild(wrap);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage('user', text);
      input.value = '';
      submitBtn.disabled = true;
      newChatBtn.disabled = true;
      setError('');

      const turn = addAssistantTurnWithTrace(true);
      const assistantDiv = turn.assistantDiv;
      const contentEl = turn.contentEl;
      const traceBodyEl = turn.traceBodyEl;

      try {
        const messages = collectMessagesForApi();

        const nameValue = document.getElementById('nameInput').value.trim() || undefined;
        const categoryValue = document.getElementById('categorySelect').value || 'Other';
        const res = await fetch(`${API_BASE}/api/chat`, {
          method: 'POST',
          headers: newChatHeaders(),
          body: JSON.stringify({
            messages: messages.map(m => ({ role: m.role, content: m.content })),
            category: categoryValue,
            name: nameValue
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || res.statusText || `HTTP ${res.status}`);
        }

        const data = await res.json();
        contentEl.textContent = data.message || '(No response)';
        renderTraceflowInto(traceBodyEl, data.traceflow);
        const total = data.total_tokens ?? (data.input_tokens != null && data.output_tokens != null ? data.input_tokens + data.output_tokens : null);
        if (total != null || data.input_tokens != null || data.output_tokens != null) {
          const parts = [];
          if (data.input_tokens != null) parts.push(`${data.input_tokens} in`);
          if (data.output_tokens != null) parts.push(`${data.output_tokens} out`);
          if (total != null && parts.length === 0) parts.push(`${total} total`);
          else if (total != null) parts.push(`${total} total`);
          const tokenEl = document.createElement('div');
          tokenEl.className = 'tokens';
          tokenEl.textContent = `Tokens: ${parts.join(' · ')}`;
          assistantDiv.appendChild(tokenEl);
        }
        appendEvaluation(assistantDiv, data.evaluation);
        assistantDiv.classList.remove('typing');
        scrollChatToBottom();
      } catch (err) {
        contentEl.textContent = 'Sorry, something went wrong.';
        assistantDiv.classList.remove('typing');
        traceBodyEl.innerHTML = '';
        const pe = document.createElement('p');
        pe.className = 'traceflow-placeholder';
        pe.textContent = 'Request failed — no trace.';
        traceBodyEl.appendChild(pe);
        setError(err.message || 'Request failed');
        scrollChatToBottom();
      }

      submitBtn.disabled = false;
      newChatBtn.disabled = false;
    });

    // Run test questions button
    const runTestsBtn = document.getElementById('runTestsBtn');

    newChatBtn.addEventListener('click', () => {
      if (runTestsBtn.disabled) return;
      startNewChat();
    });

    runTestsBtn.addEventListener('click', async () => {
      runTestsBtn.disabled = true;
      newChatBtn.disabled = true;
      submitBtn.disabled = true;
      setError('');
      for (let i = 0; i < TEST_QUESTIONS.length; i++) {
        const q = TEST_QUESTIONS[i];
        const testModel = TEST_CHAT_MODELS[i % TEST_CHAT_MODELS.length];
        runTestsProgress.textContent = `Running ${i + 1}/${TEST_QUESTIONS.length}: ${q.name} · ${testModel}`;
        addMessage('user', `[Test ${q.id}] ${q.question}`);
        const turn = addAssistantTurnWithTrace(true);
        const assistantDiv = turn.assistantDiv;
        const contentEl = turn.contentEl;
        const traceBodyEl = turn.traceBodyEl;
        try {
          const nameValue = document.getElementById('nameInput').value.trim() || undefined;
          const categoryValue = document.getElementById('categorySelect').value || 'Other';
          const res = await fetch(`${API_BASE}/api/chat`, {
            method: 'POST',
            headers: newChatHeaders(),
            body: JSON.stringify({
              messages: [{ role: 'user', content: q.question }],
              category: categoryValue,
              name: nameValue,
              model: testModel
            })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || res.statusText || `HTTP ${res.status}`);
          }
          const data = await res.json();
          contentEl.textContent = data.message || '(No response)';
          renderTraceflowInto(traceBodyEl, data.traceflow);
          const total = data.total_tokens ?? (data.input_tokens != null && data.output_tokens != null ? data.input_tokens + data.output_tokens : null);
          if (total != null || data.input_tokens != null || data.output_tokens != null) {
            const parts = [];
            if (data.input_tokens != null) parts.push(data.input_tokens + ' in');
            if (data.output_tokens != null) parts.push(data.output_tokens + ' out');
            if (total != null && parts.length === 0) parts.push(total + ' total');
            else if (total != null) parts.push(total + ' total');
            const tokenEl = document.createElement('div');
            tokenEl.className = 'tokens';
            tokenEl.textContent = 'Tokens: ' + parts.join(' · ');
            assistantDiv.appendChild(tokenEl);
          }
          appendEvaluation(assistantDiv, data.evaluation);
        } catch (err) {
          contentEl.textContent = 'Error: ' + (err.message || 'Request failed');
          traceBodyEl.innerHTML = '';
          const pe = document.createElement('p');
          pe.className = 'traceflow-placeholder';
          pe.textContent = 'Request failed — no trace.';
          traceBodyEl.appendChild(pe);
          setError(err.message || 'Request failed');
        }
        assistantDiv.classList.remove('typing');
        scrollChatToBottom();
      }
      runTestsProgress.textContent = 'Done. ' + TEST_QUESTIONS.length + ' questions run.';
      runTestsBtn.disabled = false;
      newChatBtn.disabled = false;
      submitBtn.disabled = false;
    });

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });
  </script>
</body>
</html>
