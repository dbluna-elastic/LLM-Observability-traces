# OpenTelemetry Collector: receive OTLP from OpenLLMetry, export to Elastic APM Server.
# Set ELASTIC_APM_SERVER_URL (e.g. https://your-es:8200) and optionally ELASTIC_APM_SECRET_TOKEN.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  # Set ELASTIC_APM_SERVER_URL (e.g. https://your-cluster:8200). For auth set ELASTIC_APM_SECRET_TOKEN.
  otlp/apm:
    endpoint: ${ELASTIC_APM_SERVER_URL}
    tls:
      insecure: ${ELASTIC_APM_INSECURE}
    compression: gzip
    headers:
      Authorization: "Bearer ${ELASTIC_APM_SECRET_TOKEN}"

  logging:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/apm, logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/apm, logging]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/apm, logging]
