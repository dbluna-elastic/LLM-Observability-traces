# LiteLLM proxy: Presidio PII guardrail (pre_call) then route by model_name.
# Presidio listens on port 3000 inside Docker; use :3000 for service DNS (not host ports 5002/5001).
# OpenAI routes (gpt-*): set OPENAI_API_KEY on the litellm service (see docker-compose).
# tinyllama: local Ollama; no OpenAI key required for that route.

litellm_settings:
  callbacks: ["otel"]
  forward_traceparent_to_llm_provider: true

model_list:
  - model_name: gpt-4.1-mini
    litellm_params:
      model: gpt-4.1-mini
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: tinyllama
    litellm_params:
      model: ollama/tinyllama
      api_base: http://ollama:11434
      api_key: "ollama"

guardrails:
  - guardrail_name: presidio-pii
    litellm_params:
      guardrail: presidio
      mode: pre_call
      default_on: true  # Presidio on every request; set false to disable
      presidio_analyzer_api_base: "http://presidio-analyzer:3000"
      presidio_anonymizer_api_base: "http://presidio-anonymizer:3000"
      presidio_language: "en"
      pii_entities_config:
        CREDIT_CARD: "MASK"
        EMAIL_ADDRESS: "MASK"
        PHONE_NUMBER: "MASK"
        PERSON: "MASK"
        US_SSN: "MASK"
