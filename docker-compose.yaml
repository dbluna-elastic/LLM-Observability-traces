# Chatbot website + OpenTelemetry Collector → Elastic APM
# Default: app → LiteLLM (:4000) → Presidio → OpenAI gpt-4o-mini (set OPENAI_API_KEY in .env). tinyllama stays in litellm-config for OPENAI_MODEL=tinyllama.
# Bypass LiteLLM to Ollama only: OPENAI_API_BASE=http://ollama:11434/v1 (adjust app depends_on if needed).

services:
  app:
    build: .
    ports:
      - "8088:8088"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://litellm:4000}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-chatbot-service}
      - SERVICE_ENVIRONMENT=${SERVICE_ENVIRONMENT:-chatbot}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      # Agent loop + traces (agent_call). Default model supports tools; set false if you switch to tinyllama only.
      - CHATBOT_USE_TOOLS=${CHATBOT_USE_TOOLS:-true}
      - CHATBOT_SYSTEM_INSTRUCTION=${CHATBOT_SYSTEM_INSTRUCTION:-}
    depends_on:
      otel-collector:
        condition: service_started
      litellm:
        condition: service_healthy
    restart: unless-stopped

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      # Required for gpt-4o-mini route in litellm-config.yaml (same as app .env)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Container port 3000 (host maps 5002/5001 for local debugging only)
      - PRESIDIO_ANALYZER_API_BASE=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_API_BASE=http://presidio-anonymizer:3000
      - OTEL_SERVICE_NAME=litellm-proxy
      - OTEL_DEBUG=True
      # OTLP trace export: Python SDK uses TRACES_ENDPOINT; collector HTTP receives on :4318/v1/traces
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4318/v1/traces
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 4000), timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      ollama:
        condition: service_started
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    restart: unless-stopped

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "5002:3000"
    environment:
      - GRPC_PORT=5001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 3000), timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - "5001:3000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 3000), timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.4.5
    entrypoint: ["/bin/sh", "/scripts/ollama-entrypoint.sh"]
    volumes:
      - ollama-data:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/scripts/ollama-entrypoint.sh:ro
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-tinyllama}
    ports:
      - "11434:11434"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    environment:
      - ELASTIC_APM_SERVER_URL=${ELASTIC_APM_SERVER_URL}
      - ELASTIC_APM_SECRET_TOKEN=${ELASTIC_APM_SECRET_TOKEN:-}
      - ELASTIC_APM_INSECURE=${ELASTIC_APM_INSECURE:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-chatbot-service}
      - SERVICE_ENVIRONMENT=${SERVICE_ENVIRONMENT:-chatbot}
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped

volumes:
  ollama-data:
