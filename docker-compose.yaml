# Chatbot website + OpenTelemetry Collector → Elastic APM
# Default app LLM: Elastic LiteLLM prod (OPENAI_API_BASE). Override to http://litellm:4000 for local Presidio+Ollama proxy (see litellm-config.yaml).
# Ollama direct: OPENAI_API_BASE=http://ollama:11434/v1

services:
  app:
    build: .
    ports:
      - "8088:8088"
    environment:
      # Required for default Elastic LiteLLM URL; use `ollama` only for local tinyllama + http://litellm:4000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://elastic.litellm-prod.ai}
      # Hosted Elastic: ids are often prefixed (e.g. llm-gateway/gpt-4.1-mini). List: /v1/models or GET /api/llm/models.
      - OPENAI_MODEL=${OPENAI_MODEL:-llm-gateway/gpt-4.1-mini}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-chatbot-service}
      - SERVICE_ENVIRONMENT=${SERVICE_ENVIRONMENT:-chatbot}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      # Agent/tools: tinyllama often mangles tool JSON—default off. Set true for capable cloud models.
      - CHATBOT_USE_TOOLS=${CHATBOT_USE_TOOLS:-false}
      # Weather tool: open_meteo (live, no key) or stub (fixed demo values)
      - WEATHER_PROVIDER=${WEATHER_PROVIDER:-open_meteo}
      - CHATBOT_SYSTEM_INSTRUCTION=${CHATBOT_SYSTEM_INSTRUCTION:-}
      - DEBUG_LLM_ERRORS=${DEBUG_LLM_ERRORS:-false}
      - EXPOSE_LLM_MODELS=${EXPOSE_LLM_MODELS:-false}
      # DeepEval: LLM-as-judge answer relevancy on each chat (extra latency + API cost)
      - DEEPEVAL_SCORE_CHAT=${DEEPEVAL_SCORE_CHAT:-false}
      # When true (default), runs Task Completion judge if the agent loop invoked tools (adds LLM calls)
      - DEEPEVAL_SCORE_AGENT=${DEEPEVAL_SCORE_AGENT:-true}
      - DEEPEVAL_JUDGE_MODEL=${DEEPEVAL_JUDGE_MODEL:-}
      - DEEPEVAL_INCLUDE_REASON=${DEEPEVAL_INCLUDE_REASON:-true}
      - DEEPEVAL_TELEMETRY_OPT_OUT=${DEEPEVAL_TELEMETRY_OPT_OUT:-YES}
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      # OpenAI-backed routes in local litellm-config (e.g. gpt-4.1-mini); optional if only using tinyllama
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Container port 3000 (host maps 5002/5001 for local debugging only)
      - PRESIDIO_ANALYZER_API_BASE=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_API_BASE=http://presidio-anonymizer:3000
      - OTEL_SERVICE_NAME=litellm-proxy
      - OTEL_DEBUG=True
      # OTLP trace export: Python SDK uses TRACES_ENDPOINT; collector HTTP receives on :4318/v1/traces
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4318/v1/traces
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 4000), timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      ollama:
        condition: service_started
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    restart: unless-stopped

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "5002:3000"
    environment:
      - GRPC_PORT=5001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 3000), timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - "5001:3000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 3000), timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.4.5
    entrypoint: ["/bin/sh", "/scripts/ollama-entrypoint.sh"]
    volumes:
      - ollama-data:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/scripts/ollama-entrypoint.sh:ro
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-tinyllama}
    ports:
      - "11434:11434"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    environment:
      - ELASTIC_APM_SERVER_URL=${ELASTIC_APM_SERVER_URL}
      - ELASTIC_APM_SECRET_TOKEN=${ELASTIC_APM_SECRET_TOKEN:-}
      - ELASTIC_APM_INSECURE=${ELASTIC_APM_INSECURE:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-chatbot-service}
      - SERVICE_ENVIRONMENT=${SERVICE_ENVIRONMENT:-chatbot}
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped

volumes:
  ollama-data:
